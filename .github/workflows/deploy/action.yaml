name: 'Deploy'
description: 'Perform any operations that require some deployment tasks. See deploy=config.json for details on the structure of the input data.'

inputs:
  branch:
    description: 'The branch the deployment is being performed on.'
    required: true
  branch-name:
    description: 'The full name of the branch the deployment is being created in.'
    required: true
  deploy-config-json:
    description: 'The configuration to use when deploying, stored as JSON.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Write deploy-config.json
      if: inputs.package == 'packages/synchronised-storage-service' || inputs.package == 'all'
      shell: bash
      run: |
        echo '${{ inputs.deploy-config-json }}' > ./packages/synchronised-storage-service/scripts/deploy-config.json

    - name: Setup sync storage for mainnet
      shell: bash
      run: |
        cd packages/synchronised-storage-service
        DEPLOY_MNEMONIC=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.mnemonic')
        DEPLOY_NODE_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.nodeUrl')
        DEPLOY_NETWORK=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.network')
        DEPLOY_CONTROLLER=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.controller')
        DEPLOY_WALLET_INDEX=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.walletIndex')
        DEPLOY_ALLOW_LIST=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.allowList' | join(","))
        node ./scripts/setup-sync-storage.mjs

    - name: Setup sync storage for testnet
      shell: bash
      run: |
        cd packages/synchronised-storage-service
        DEPLOY_MNEMONIC=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.mnemonic')
        DEPLOY_NODE_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.nodeUrl')
        DEPLOY_NETWORK=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.network')
        DEPLOY_CONTROLLER=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.controller')
        DEPLOY_WALLET_INDEX=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.walletIndex')
        DEPLOY_ALLOW_LIST=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.allowList' | join(","))
        node ./scripts/setup-sync-storage.mjs

    # Disable until verifiable storage is fixed for devnet
